<footer class="footer">
  <div class="container">
    <div class="footer__left">
      <div class="footer__copy">
        {{ .Site.Params.footer.copyright }}
      </div>
    </div>
    <div class="footer__links">
      <ul class="navbar-nav ">
        <li class="nav-item">
          <a class="nav-link" href="{{ .Site.BaseURL | absURL }}">HOME</a>
        </li>
        {{ range .Site.Menus.footer }}
        <li class="nav-item">
          <a class="nav-link" href="{{ .URL | absURL }}">{{ .Name | upper }}</a>
        </li>
        {{ end }}
      </ul>
    </div>
    <div class="footer__right">
      {{ with .Site.Params.footer.radity_logo }}
      {{ if .x }}
      <img
        src="{{ .x | absURL }}"
        {{ with ._2x }}srcset="{{ $.Site.Params.footer.radity_logo.x | absURL }} 1x, {{ . | absURL }} 2x"{{ end }}
        alt="{{ .alt }}"
      />
      {{ end }}
      {{ end }}
    </div>
  </div>
</footer>
