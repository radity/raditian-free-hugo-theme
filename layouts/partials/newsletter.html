{{ if hugo.Data.homepage.newsletter.enable }}
<section class="section section--cta">
<div class="container">
  <div class="row">
    <div class="col-12 text-center">
      <h2>{{ hugo.Data.homepage.newsletter.title }}</h2>
      <div class="rad-subscription-group">
        {{/* Display-only form: it has no action and never sends data anywhere. */}}
        <form id="rad-subscription" onsubmit="return false;" novalidate>
          <input
            id="rad-subscription-email"
            name="email"
            type="email"
            autocomplete="email"
            class="form-control"
            aria-describedby="emailHelp"
            placeholder="Email Address..."
            aria-label="Email Address"
          />
          <button type="button" id="rad-subscription-submit" class="btn btn-light btn-rounded">
            Sign Up
          </button>
        </form>
      </div>
      <small id="emailHelp" class="form-text text-muted"
        >{{ hugo.Data.homepage.newsletter.note }}</small
      >
    </div>
  </div>
</div>
</section>
{{ end }}
